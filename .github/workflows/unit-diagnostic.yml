name: Unit test diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Capture unit test output
        run: |
          npm run test -- --reporter=verbose > unit-tests.log 2>&1 || true

      - name: Upload unit test output
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostic
          path: unit-tests.log
          if-no-files-found: error
