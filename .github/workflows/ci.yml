name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prettier repair patch
        if: failure()
        run: |
          npm run format
          git diff --binary > prettier.patch

      - name: Upload Prettier repair patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-repair-patch
          path: prettier.patch
          if-no-files-found: error

      - name: Validate content
        run: npm run validate:content

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Unit tests
        id: unit-tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee unit-tests.log

      - name: Upload unit test diagnostics
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostics
          path: unit-tests.log
          if-no-files-found: error

      - name: Production build
        run: npm run build

      - name: Validate repository
        run: python tools/validate_repository.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        id: browser-smoke
        run: |
          set -o pipefail
          npx playwright test tests/e2e/app.spec.ts --project=chromium --retries=0 --workers=4 --reporter=line 2>&1 | tee playwright-smoke.log

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-smoke.log
            test-results
            playwright-report
          if-no-files-found: warn

      - name: Upload package lock
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Package production build
        run: |
          test -f dist/index.html
          tar -czf gargotte-adventure-dist.tar.gz -C dist .

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: gargotte-adventure-dist
          path: gargotte-adventure-dist.tar.gz
          if-no-files-found: error
